<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Revenue Recovery Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #1e1e2d; color: #fff; }
        .sidebar .nav-link { color: #a1a5b7; padding: 1rem 1.5rem; font-weight: 500; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: #2b2b40; }
        .sidebar-brand { padding: 1.5rem; font-size: 1.25rem; font-weight: 700; color: #fff; border-bottom: 1px solid #2b2b40; }
        .topbar { background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.05); padding: 1rem 2rem; margin-bottom: 2rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,.03); margin-bottom: 1.5rem; }
        .card-header { background: #fff; border-bottom: 1px solid #f1f1f4; padding: 1.5rem; font-weight: 600; border-top-left-radius: 12px; border-top-right-radius: 12px; }
        .stat-card { transition: transform .2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-value { font-size: 2rem; font-weight: 700; color: #181c32; }
        .stat-label { font-size: 0.875rem; color: #a1a5b7; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .badge-soft-success { background-color: rgba(80, 205, 137, 0.1); color: #50cd89; }
        .badge-soft-danger { background-color: rgba(241, 65, 108, 0.1); color: #f1416c; }
        .badge-soft-warning { background-color: rgba(255, 199, 0, 0.1); color: #ffc700; }
        .badge-soft-info { background-color: rgba(114, 57, 234, 0.1); color: #7239ea; }
        .table > :not(caption) > * > * { padding: 1rem 1.5rem; border-bottom-color: #f1f1f4; }
        .table thead th { color: #a1a5b7; font-size: 0.85rem; text-transform: uppercase; font-weight: 600; }
        .table tbody td { color: #3f4254; font-weight: 500; vertical-align: middle; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar d-flex flex-column" style="width: 260px;">
            <div class="sidebar-brand">
                <i class="bi bi-shield-check text-primary me-2"></i> Aftermind RecovAI
            </div>
            <ul class="nav flex-column mb-auto mt-3">
                <li class="nav-item">
                    <a href="{% url 'recovery:dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                        <i class="bi bi-grid-1x2 me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'recovery:case_list' %}" class="nav-link {% if request.resolver_match.url_name == 'case_list' %}active{% endif %}">
                        <i class="bi bi-briefcase me-2"></i> Recovery Cases
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="bi bi-gear me-2"></i> Settings
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main content -->
        <div class="flex-grow-1" style="max-height: 100vh; overflow-y: auto;">
            <div class="topbar d-flex justify-content-between align-items-center">
                <h4 class="m-0 fw-bold">{% block page_title %}Dashboard{% endblock %}</h4>
                <div class="d-flex align-items-center">
                    <div class="text-end me-3">
                        <div class="fw-bold fs-6">Demo Merchant</div>
                        <div class="text-muted fs-7" style="font-size: 0.8rem;">Test Environment</div>
                    </div>
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        DM
                    </div>
                </div>
            </div>

            <div class="container-fluid px-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
